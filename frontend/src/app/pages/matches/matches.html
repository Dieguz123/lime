<section class="matches">
  <h2>Your matches 🍿 ({{ matches().length }})</h2>

  <ul class="match-list">
    @for (film of matches(); track film.id) {
      <li class="match-card">
        <span class="match-title">{{ film.name }}</span>
        <span class="match-meta">({{ film.releaseYear }}) · {{ film.platform }}</span>
      </li>
    } @empty {
      <li class="empty">No matches yet, keep swiping! 👀</li>
    }
  </ul>

  <a class="link back" [routerLink]="['/room', code]">← Back to swiping</a>
</section>
