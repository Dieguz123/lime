<section class="home">
  <input class="tab-radio" type="radio" name="home-tab" id="tab-create" checked />
  <input class="tab-radio" type="radio" name="home-tab" id="tab-join" />

  <div class="tabs">
    <label class="tab" for="tab-create">Create a room</label>
    <label class="tab" for="tab-join">Join a room</label>
  </div>

  <div class="panel panel-create">
    <label class="field">
      Your name
      <input class="input" [(ngModel)]="username" placeholder="Diego" maxlength="30" />
    </label>

    <button class="btn btn-block" (click)="createRoom()" [disabled]="!username.trim()">
      Create a room
    </button>
  </div>

  <div class="panel panel-join">
    <label class="field">
      Your name
      <input class="input" [(ngModel)]="username" placeholder="Diego" maxlength="30" />
    </label>

    <label class="field">
      Invite code
      <input class="input code-input" [(ngModel)]="code" placeholder="ABC123" maxlength="6" />
    </label>

    <button class="btn btn-block" (click)="joinRoom()" [disabled]="!username.trim() || code.length !== 6">
      Join
    </button>
  </div>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</section>
