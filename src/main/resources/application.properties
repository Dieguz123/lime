spring.application.name=lime

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lime}
spring.datasource.username=${DB_USER:lime}
spring.datasource.password=${DB_PASSWORD:lime}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

tmdb.base-url=https://api.themoviedb.org/3
tmdb.token=${TMDB_TOKEN:}
tmdb.import.enabled=true

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes}
jwt.expiration=7d